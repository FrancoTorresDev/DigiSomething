<svg width="1400" height="280" viewBox="0 0 1400 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base gradient: navy left → midnight right -->
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#061B5B" stop-opacity="0.98"/>
      <stop offset="0.50" stop-color="#041448" stop-opacity="0.98"/>
      <stop offset="1"    stop-color="#030A24" stop-opacity="0.99"/>
    </linearGradient>

    <!-- Left blue glow — covers thumbnail area -->
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(100 140) rotate(8) scale(310 130)">
      <stop offset="0"    stop-color="#0E5BFF" stop-opacity="0.38"/>
      <stop offset="0.40" stop-color="#0E5BFF" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#0E5BFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Right cyan glow — top-right corner -->
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1300 54) rotate(155) scale(280 150)">
      <stop offset="0"    stop-color="#1EDCFF" stop-opacity="0.20"/>
      <stop offset="0.50" stop-color="#1EDCFF" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#1EDCFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Thumbnail separator glow -->
    <linearGradient id="thumbSep" x1="230" y1="0" x2="260" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1EDCFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1EDCFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Border: blue-left → cyan-center → cyan-right -->
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#2D7CFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#1EDCFF" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#1EDCFF" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Top edge accent line -->
    <linearGradient id="topLine" x1="0" y1="0" x2="1400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#2D7CFF" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#2D7CFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#1EDCFF" stop-opacity="0.30"/>
      <stop offset="1"    stop-color="#1EDCFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Diagonal sheen — right panel -->
    <linearGradient id="sheen" x1="940" y1="0" x2="1300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#1EDCFF" stop-opacity="0.00"/>
      <stop offset="0.40" stop-color="#1EDCFF" stop-opacity="0.10"/>
      <stop offset="0.62" stop-color="#1EDCFF" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#1EDCFF" stop-opacity="0.00"/>
    </linearGradient>

    <pattern id="hexPattern" x="0" y="0" width="42" height="36.373" patternUnits="userSpaceOnUse">
      <path d="M10.5 1L31.5 1L42 18.187L31.5 35.373L10.5 35.373L0 18.187Z"
        stroke="#1EDCFF" stroke-opacity="0.14" fill="none"/>
    </pattern>

    <pattern id="dotGrid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#76CFFF" fill-opacity="0.09"/>
    </pattern>

    <filter id="softGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="4" y="4" width="1392" height="272" rx="20"/>
    </clipPath>
  </defs>

  <!-- Base + glow layers -->
  <rect x="4" y="4" width="1392" height="272" rx="20" fill="url(#bg)"/>
  <rect x="4" y="4" width="1392" height="272" rx="20" fill="url(#glowLeft)"/>
  <rect x="4" y="4" width="1392" height="272" rx="20" fill="url(#glowRight)"/>

  <g clip-path="url(#clip)">
    <!-- Subtle dot texture across whole card -->
    <rect width="1400" height="280" fill="url(#dotGrid)" opacity="0.30"/>

    <!-- Thumbnail area separator glow -->
    <rect x="225" y="4" width="30" height="272" fill="url(#thumbSep)"/>

    <!-- Circuit traces — upper left (inside thumbnail area) -->
    <g opacity="0.78">
      <path d="M58 28H170L196 52H270"  stroke="#20CFFF" stroke-opacity="0.28" stroke-width="1.6"/>
      <path d="M72 56H142L168 80H222"  stroke="#20CFFF" stroke-opacity="0.19" stroke-width="1.6"/>
      <path d="M82 86H136L154 104H210" stroke="#20CFFF" stroke-opacity="0.14" stroke-width="1.6"/>
      <circle cx="58" cy="28"  r="3" fill="#20CFFF" fill-opacity="0.55"/>
      <circle cx="72" cy="56"  r="3" fill="#20CFFF" fill-opacity="0.42"/>
      <circle cx="82" cy="86"  r="2.5" fill="#20CFFF" fill-opacity="0.35"/>
    </g>

    <!-- Circuit traces — lower right -->
    <g opacity="0.70">
      <path d="M1148 224H1228L1258 194H1328" stroke="#20CFFF" stroke-opacity="0.22" stroke-width="1.6"/>
      <path d="M1108 252H1192L1218 226H1304" stroke="#20CFFF" stroke-opacity="0.17" stroke-width="1.6"/>
      <circle cx="1328" cy="224" r="3"   fill="#20CFFF" fill-opacity="0.44"/>
      <circle cx="1304" cy="252" r="3"   fill="#20CFFF" fill-opacity="0.36"/>
    </g>

    <!-- Diagonal sheen -->
    <path d="M1028 0H1400V280H968L1054 0H1028Z" fill="url(#sheen)" opacity="0.95"/>

    <!-- Hex grid — right panel (starts at ~73% of width) -->
    <rect x="1020" y="14" width="370" height="252" fill="url(#hexPattern)" opacity="0.95"/>

    <!-- Scattered glowing squares — right zone -->
    <g opacity="0.44">
      <rect x="1040" y="66"  width="8"  height="8"  fill="#1EDCFF"/>
      <rect x="1072" y="80"  width="5"  height="5"  fill="#1EDCFF" opacity="0.72"/>
      <rect x="1116" y="98"  width="10" height="10" fill="#1EDCFF" opacity="0.36"/>
      <rect x="1196" y="52"  width="6"  height="6"  fill="#1EDCFF" opacity="0.58"/>
      <rect x="1236" y="84"  width="8"  height="8"  fill="#1EDCFF" opacity="0.48"/>
      <rect x="1284" y="118" width="5"  height="5"  fill="#1EDCFF" opacity="0.65"/>
      <rect x="1338" y="70"  width="8"  height="8"  fill="#1EDCFF" opacity="0.34"/>
      <rect x="1308" y="194" width="10" height="10" fill="#1EDCFF" opacity="0.33"/>
      <rect x="1264" y="218" width="5"  height="5"  fill="#1EDCFF" opacity="0.58"/>
      <rect x="1204" y="230" width="9"  height="9"  fill="#1EDCFF" opacity="0.44"/>
      <rect x="1158" y="206" width="5"  height="5"  fill="#1EDCFF" opacity="0.70"/>
      <rect x="1098" y="178" width="7"  height="7"  fill="#1EDCFF" opacity="0.32"/>
    </g>

    <!-- Corner bracket L lines -->
    <path d="M1268 18L1382 18L1382 108" stroke="#1EDCFF" stroke-opacity="0.26" stroke-width="1.8"/>
    <path d="M20 252L20 172L92 172"     stroke="#0E5BFF" stroke-opacity="0.14" stroke-width="1.8"/>

    <!-- Broad soft blue sweep (far left background atmosphere) -->
    <path d="M0 68C100 98 178 114 284 94" stroke="#2D7CFF" stroke-opacity="0.06" stroke-width="44"/>
  </g>

  <!-- Outer gradient border -->
  <rect x="4" y="4" width="1392" height="272" rx="20" stroke="url(#borderGlow)" stroke-width="2"/>
  <!-- Inner secondary ring -->
  <rect x="9" y="9" width="1382" height="262" rx="16" stroke="#76CFFF" stroke-opacity="0.06"/>
  <!-- Top accent line -->
  <line x1="4" y1="4" x2="1396" y2="4" stroke="url(#topLine)" stroke-width="1.5"/>

  <!-- Glowing corner accents (top-right + bottom-right trail) -->
  <g filter="url(#softGlow)">
    <path d="M1318 10H1368L1388 28V68"
      stroke="#1EDCFF" stroke-opacity="0.44" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M1148 270H1296L1324 244H1388"
      stroke="#1EDCFF" stroke-opacity="0.28" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>